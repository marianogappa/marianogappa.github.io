<svg viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="250" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="21" y="34" font-size="19" font-weight="700" fill="#0f172a">From keypresses to a number you can argue with</text>

  <g font-size="12">
    <!-- 1 -->
    <rect x="21" y="58" width="128" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="85" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">The replay</text>
    <text x="85" y="106" text-anchor="middle" fill="#475569">12,431 keypresses,</text>
    <text x="85" y="124" text-anchor="middle" fill="#475569">each timestamped.</text>
    <text x="85" y="150" text-anchor="middle" fill="#94a3b8">Never the map or</text>
    <text x="85" y="166" text-anchor="middle" fill="#94a3b8">the strategy.</text>

    <!-- 2 -->
    <rect x="167" y="58" width="128" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="231" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">360 habits</text>
    <text x="231" y="106" text-anchor="middle" fill="#475569">Which hotkeys.</text>
    <text x="231" y="124" text-anchor="middle" fill="#475569">Gaps between</text>
    <text x="231" y="142" text-anchor="middle" fill="#475569">clicks. Double-tap</text>
    <text x="231" y="160" text-anchor="middle" fill="#475569">intervals.</text>

    <!-- 3 -->
    <rect x="313" y="58" width="128" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="377" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Keep 150</text>
    <text x="377" y="106" text-anchor="middle" fill="#475569">The ones that tell</text>
    <text x="377" y="124" text-anchor="middle" fill="#475569">people apart, not</text>
    <text x="377" y="142" text-anchor="middle" fill="#475569">the ones that tell</text>
    <text x="377" y="160" text-anchor="middle" fill="#475569">games apart.</text>

    <!-- 4 -->
    <rect x="459" y="58" width="128" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="523" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">De-duplicate</text>
    <text x="523" y="106" text-anchor="middle" fill="#475569">Habits that move</text>
    <text x="523" y="124" text-anchor="middle" fill="#475569">together stop</text>
    <text x="523" y="142" text-anchor="middle" fill="#475569">counting three</text>
    <text x="523" y="160" text-anchor="middle" fill="#475569">times.</text>

    <!-- 5 -->
    <rect x="605" y="58" width="128" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="669" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Compare</text>
    <text x="669" y="106" text-anchor="middle" fill="#475569">Similarity, graded</text>
    <text x="669" y="124" text-anchor="middle" fill="#475569">against a crowd of</text>
    <text x="669" y="142" text-anchor="middle" fill="#475569">strangers rather</text>
    <text x="669" y="160" text-anchor="middle" fill="#475569">than in a vacuum.</text>

    <!-- result -->
    <rect x="751" y="58" width="128" height="118" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="815" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">A verdict</text>
    <text x="815" y="110" text-anchor="middle" font-size="17" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">6.70</text>
    <text x="815" y="134" text-anchor="middle" fill="#475569">3.61 clear of the</text>
    <text x="815" y="150" text-anchor="middle" fill="#475569">next candidate,</text>
    <text x="815" y="166" text-anchor="middle" fill="#475569">clears 1-in-1,000.</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="151" y1="117" x2="163" y2="117"/>
    <line x1="297" y1="117" x2="309" y2="117"/>
    <line x1="443" y1="117" x2="455" y2="117"/>
    <line x1="589" y1="117" x2="601" y2="117"/>
    <line x1="735" y1="117" x2="747" y2="117"/>
  </g>

  <text x="21" y="212" font-size="13" fill="#64748b">The output is never yes or no. It is a score, a count of how many games back it, and a stated error budget.</text>
  <text x="21" y="232" font-size="11" fill="#94a3b8">Full method: github.com/marianogappa/scfingerprint/blob/main/docs/METHODOLOGY.md</text>
</svg>
