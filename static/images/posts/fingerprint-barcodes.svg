<svg viewBox="0 0 900 350" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="350" fill="#ffffff"/>

  <text x="40" y="42" font-size="19" font-weight="700" fill="#0f172a">Why you cannot look up a barcode name</text>

  <!-- decoded example -->
  <g font-size="30" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="42"  y="112" fill="#2563eb">I</text>
    <text x="70"  y="112" fill="#d97706">l</text>
    <text x="98"  y="112" fill="#2563eb">I</text>
    <text x="126" y="112" fill="#d97706">l</text>
    <text x="154" y="112" fill="#2563eb">I</text>
    <text x="182" y="112" fill="#d97706">l</text>
    <text x="210" y="112" fill="#2563eb">I</text>
    <text x="238" y="112" fill="#d97706">l</text>
    <text x="266" y="112" fill="#2563eb">I</text>
    <text x="294" y="112" fill="#2563eb">I</text>
    <text x="322" y="112" fill="#d97706">l</text>
    <text x="350" y="112" fill="#d97706">l</text>
    <text x="378" y="112" fill="#2563eb">I</text>
    <text x="406" y="112" fill="#d97706">l</text>
    <text x="434" y="112" fill="#2563eb">I</text>
  </g>
  <g font-size="12" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="47"  y="136" fill="#2563eb">I</text><text x="75"  y="136" fill="#d97706">l</text>
    <text x="103" y="136" fill="#2563eb">I</text><text x="131" y="136" fill="#d97706">l</text>
    <text x="159" y="136" fill="#2563eb">I</text><text x="187" y="136" fill="#d97706">l</text>
    <text x="215" y="136" fill="#2563eb">I</text><text x="243" y="136" fill="#d97706">l</text>
    <text x="271" y="136" fill="#2563eb">I</text><text x="299" y="136" fill="#2563eb">I</text>
    <text x="327" y="136" fill="#d97706">l</text><text x="355" y="136" fill="#d97706">l</text>
    <text x="383" y="136" fill="#2563eb">I</text><text x="411" y="136" fill="#d97706">l</text>
    <text x="439" y="136" fill="#2563eb">I</text>
  </g>

  <g font-size="13">
    <rect x="530" y="82" width="14" height="14" rx="3" fill="#2563eb"/>
    <text x="554" y="94" fill="#334155">capital i</text>
    <rect x="530" y="106" width="14" height="14" rx="3" fill="#d97706"/>
    <text x="554" y="118" fill="#334155">lowercase L</text>
  </g>
  <text x="660" y="104" font-size="13" fill="#64748b">Add the digit 1 and you have</text>
  <text x="660" y="122" font-size="13" fill="#64748b">three characters that render</text>
  <text x="660" y="140" font-size="13" fill="#64748b">as the same vertical stroke.</text>

  <line x1="40" y1="172" x2="860" y2="172" stroke="#e2e8f0" stroke-width="2"/>

  <text x="40" y="202" font-size="13" fill="#64748b">Three different people, in the same sample:</text>
  <g font-size="22" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">
    <text x="42" y="238">IlIlIlIlIIllIlI</text>
    <text x="330" y="238">IIlllIIlIIlllIl</text>
    <text x="618" y="238">lIIllIIIllIIIll</text>
  </g>

  <!-- proportion bar -->
  <text x="40" y="286" font-size="13" fill="#64748b">Share of ladder player names that are pure barcode:</text>
  <rect x="40" y="298" width="600" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="40" y="298" width="163" height="20" rx="4" fill="#2563eb"/>
  <text x="656" y="313" font-size="14" font-weight="700" fill="#0f172a">188 of 693</text>
  <text x="40" y="338" font-size="11" fill="#94a3b8">Measured on the 369-account labelled corpus in scfingerprint.</text>
</svg>
